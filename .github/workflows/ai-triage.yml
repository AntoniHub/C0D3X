# Triage agent: when the API tests fail on the default branch, classify the failures and open one issue.
# The failure fingerprint is compared with the open issues first, so a failure that is already known
# never reaches the model. Without the ANTHROPIC_API_KEY repository secret the workflow ends green.
#
# Built by QA Engineer | Antonio Rodriguez Farias

name: AI Triage | QA Engineer | Antonio Rodriguez Farias

on:
  workflow_run:
    workflows: ["API Tests | Python and pytest | QA Engineer | Antonio Rodriguez Farias"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ai-triage
  cancel-in-progress: false

jobs:
  gate:
    name: Check prerequisites
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}
    steps:
      - id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not configured, so the triage agent was not run. Add the repository secret to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi

  triage:
    name: Triage failed API tests
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/qa_triage/pyproject.toml

      - name: Install the triage agent
        run: pip install ./agents/qa_triage

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: api-*-results
          merge-multiple: true
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Triage and open the issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(reports/*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No JUnit reports found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          fingerprint="$(qa-triage fingerprint "${reports[@]}")"
          if [ "$fingerprint" = "none" ]; then
            echo "The reports contain no failing tests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh label create ai-triage --description "Opened by the triage agent" --color 5319e7 --force
          existing="$(gh issue list --label ai-triage --state open --json number,body \
            --jq ".[] | select(.body | contains(\"qa-triage:fp=${fingerprint}\")) | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing in ${RUN_URL}. The model was not called again."
            exit 0
          fi

          qa-triage triage "${reports[@]}" --out issue.md
          gh issue create --title "API test failures (${fingerprint})" --body-file issue.md --label ai-triage
