# CI for the AI workflow code: the triage agent and the Claude Code hooks. No secrets and no network
# calls to a model: the agent is tested against a stub client.
#
# Built by QA Engineer | Antonio Rodriguez Farias

name: Agents CI | QA Engineer | Antonio Rodriguez Farias

on:
  push:
    paths:
      - "agents/**"
      - ".claude/**"
      - ".github/workflows/agents-ci.yml"
  pull_request:
    paths:
      - "agents/**"
      - ".claude/**"
      - ".github/workflows/agents-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-triage:
    name: Triage agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents/qa_triage
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/qa_triage/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint, format and type check
        run: ruff check . && ruff format --check . && mypy

      - name: Run tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  hooks:
    name: Claude Code hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .claude/hooks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "pytest>=8.2,<9" "ruff>=0.5"

      - name: Lint and format check
        run: ruff check . && ruff format --check .

      - name: Run tests
        run: pytest -q
