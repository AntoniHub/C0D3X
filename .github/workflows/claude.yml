# Claude in issues and pull requests: comment "@claude" and ask for a review or an answer.
# Only the repository owner can trigger it, and it ends green when the ANTHROPIC_API_KEY secret is missing.
# It has no write access to the code: raise contents to write deliberately if edits should be pushed.
#
# Built by QA Engineer | Antonio Rodriguez Farias

name: Claude | QA Engineer | Antonio Rodriguez Farias

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    name: Check trigger and prerequisites
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.key.outputs.enabled }}
    steps:
      - id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not configured, so Claude was not run. Add the repository secret to enable it." >> "$GITHUB_STEP_SUMMARY"
          fi

  claude:
    name: Respond to the mention
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model sonnet
            --max-turns 10
