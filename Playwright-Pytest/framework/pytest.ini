[pytest]
testpaths = tests
# Trace, video and screenshot are kept only for failed tests: small reports, full evidence.
addopts = -ra --tracing retain-on-failure --video retain-on-failure --screenshot only-on-failure --output reports/artifacts
markers =
    smoke: fast checks that the app is usable
    regression: broader functional coverage
    api: tests that use the HTTP API directly
filterwarnings =
    ignore::DeprecationWarning

